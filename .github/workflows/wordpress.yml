name: WordPress plugin

# Runs the plugin's PHPUnit tests, which share spec/ with the TypeScript tests in ci.yml.
on:
  push:
    paths: ["wordpress/**", "spec/**", ".github/workflows/wordpress.yml"]
  pull_request:
    paths: ["wordpress/**", "spec/**", ".github/workflows/wordpress.yml"]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Every PHP version WordPress supports, from its minimum.
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]
    defaults:
      run:
        working-directory: wordpress
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
