name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --reporter=default --reporter=json --outputFile.json=test-results.json
      - if: always() && hashFiles('test-results.json') != ''
        run: node scripts/ci-summary.mjs test-results.json "$GITHUB_STEP_SUMMARY"
      - if: always() && hashFiles('test-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.json
