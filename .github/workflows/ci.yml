name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The bench and the tests wait on servers, so a server that never answers would otherwise hold the job for hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node bench/latency.js --check

  # A pull request that changes the published package must add a changeset, so its version bump isn't forgotten. See CONTRIBUTING.md.
  # A release/ branch is the one that turns the changesets into the new version, so it has none left.
  changeset:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The check compares the pull request with its base branch, so it needs that branch's history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx changeset status --since="origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}
